<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>DevBoard</title>
  </head>
  <body class="bg-[rgb(55,82,253,10%)] h-full p-4" id="bg-color">
    <header class="max-h-[100px] mb-4">
      <div
        class="w-11/12 max-w-7xl mx-auto bg-white flex flex-col sm:flex-row justify-between rounded-2xl sm:max-h-[100px] h-[100px] px-4"
      >
        <div class="flex items-center gap-2">
          <img class="h-[51px]" src="assets/logo.png" alt="" />
          <h3 class="text-4xl">Dev<span class="font-bold">Board</span></h3>
        </div>
        <div class="flex items-center gap-10 sm:gap-3">
          <button
            class="btn w-28 h-16 rounded-4xl bg-[rgb(55,82,253,10%)] flex items-center"
          >
            <input type="checkbox" class="h-6 w-6" checked />
            <span id="total-task" class="text-[32px] font-bold">0</span>
          </button>
          <button
            id="bg-btn"
            class="w-16 h-16 items-center p-2 rounded-full bg-[rgb(55,82,253,10%)] btn"
          >
            <img class="h-10 w-10 bg-cover" src="assets/theme-btn.png" alt="" />
          </button>
        </div>
      </div>
    </header>
    <main
      class="w-11/12 max-w-7xl m-auto flex items-center lg:items-start md:justify-between flex-col rounded-2xl gap-4 lg:flex-row"
    >
      <div class="w-full lg:w-3/4 max-w-[1146px] bg-white rounded-2xl">
        <section class="flex flex-col md:flex-row justify-between m-4 gap-3">
          <div
            class="flex justify-center gap-2 bg-[rgb(55,82,253,10%)] w-full md:w-[263px] h-32 rounded-xl p-4 items-center"
          >
            <form class="h-16 w-16 bg-white rounded-full p-4.5">
              <input class="w-7 h-7 my-auto" type="checkbox" checked />
            </form>
            <div
              class=" flex md:flex-col items-center md:items-start gap-2 md:gap-0"
            >
              <p class="text-base font-medium text-[#00303C] lg:text-nowrap">Task Assigned</p>
              <p id="task-count" class="text-[32px] font-bold">06</p>
            </div>
          </div>
          <a href="blogs.html" class="w-full md:max-w-[524px] md:w-2/4">
            <div
              class="flex h-32 bg-gradient-to-r from-[#3752FD] via-[#6C7FFA] to-[#9BA8F8] rounded-xl items-center p-6 gap-4"
            >
              <img class="w-14" src="assets/board.png" alt="" />
              <h3 class="text-2xl font-medium text-white w-80">
                Discover Something<br />New Today!
              </h3>
            </div>
          </a>
          <div
            class="flex justify-between gap-2 bg-[rgb(55,82,253,10%)] md:w-[263px] h-32 rounded-xl p-4 items-center"
          >
            <div class="w-16 h-16 bg-white rounded-full p-4.5">
              <img class="h-7 w-7" src="assets/calender.png" alt="" />
            </div>
            <div id="date" class="w-3/4"></div>
          </div>
        </section>

        <hr class="border-dashed text-[rgb(55,82,253,10%)]" />

        <section
          id="task-container"
          class="m-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 lg:gap-9"
        ></section>

        <script>
          const tasks = [
            {
              company: "ShopeEase",
              title: "Fix Mobile Button Issue",
              description:
                "Debug using Chrome DevTools, check for overlapping elements.",
              deadline: "21 March 2025",
            },
            {
              company: "CloudSync",
              title: "Add Dark Mode",
              description:
                "Store the user's preference in localStorage, update CSS variables.",
              deadline: "21 March 2025",
            },
            {
              company: "SwiftPay",
              title: "Optimize Home page",
              description:
                "Debug using Chrome DevTools, check for overlapping elements.",
              deadline: "21 March 2025",
            },
            {
              company: "Meta",
              title: "Add new emoji 🤲",
              description:
                "Debug using Chrome DevTools, check for overlapping elements.",
              deadline: "21 March 2025",
            },
            {
              company: "Google LLC",
              title: "Integrate OpenAI API",
              description:
                "Debug using Chrome DevTools, check for overlapping elements.",
              deadline: "21 March 2025",
            },
            {
              company: "Glassdoar",
              title: "Improve Job searching",
              description:
                "Debug using Chrome DevTools, check for overlapping elements.",
              deadline: "21 March 2025",
            },
          ];

          const container = document.getElementById("task-container");

          container.innerHTML = tasks
            .map(
              (task, index) => `
          <div class="bg-[#3752FD20] max-w-[342px] min-h-80 rounded-2xl p-4">
            <div class="w-28 h-10 bg-white text-center py-2 rounded-lg">
              <p class="text-base font-normal">${task.company}</p>
            </div>
            <h3 class="text-2xl font-medium my-4">${task.title}</h3>
            <div class="min-h-24 w-auto bg-white rounded-lg p-5 mb-4">
              <p class="text-base opacity-50">${task.description}/p>
            </div>
            <div class="flex justify-between gap-1">
              <div>
                <p class="text-sm opacity-70">${task.deadline}</p>
                <h4 class="text-base font-medium">21 March 2025</h4>
              </div>
              <button id="task-btn${index + 1}" class="btn h-11 bg-[#3752FD] text-base text-white font-medium rounded-lg">
                Completed
              </button>
            </div>
          </div>`,
            )
            .join("");
        </script>
      </div>
      <div class="w-full lg:w-1/4 max-w-[366px] bg-white rounded-2xl">
        <div>
          <div class="flex w-40 mx-auto mt-8 gap-3">
            <img class="w-6 h-6" src="assets/activity.png" alt="" />
            <h1 class="text-xl font-medium">Activity Log</h1>
          </div>
          <div class="mx-auto my-3 w-40">
            <button
              id="clearActivity"
              class="btn bg-[#3752FD] text-white rounded-lg text-base h-11"
            >
              Clear History
            </button>
          </div>
          <hr class="my-8 border-dashed text-[rgb(55,82,253,10%)]" />
        </div>
        <div id="activity"></div>
      </div>
    </main>
    <script src="script/backgroungColor.js"></script>
    <script src="script/task.js"></script>
    <script src="script/clearActivity.js"></script>
    <script src="script/date.js"></script>
  </body>
</html>
